<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Service Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Twilio OTP Tester</h1>

        <!-- Step 1: Send OTP -->
        <div id="step-1" class="space-y-4">
            <p class="text-sm text-gray-600 mb-2">Enter your phone number (E.164 format, e.g. +919876543210)</p>
            <input type="text" id="phone" placeholder="+919876543210" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="sendOtp()" id="send-btn" class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">Send OTP</button>
            <p id="send-msg" class="text-sm mt-2 hidden"></p>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step-2" class="space-y-4 hidden mt-6 border-t pt-6">
            <p class="text-sm text-gray-600 mb-2">Enter the OTP you received via SMS</p>
            <input type="text" id="otp" placeholder="123456" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="verifyOtp()" id="verify-btn" class="w-full bg-green-600 text-white font-semibold py-2 rounded hover:bg-green-700 transition">Verify OTP</button>
            <p id="verify-msg" class="text-sm mt-2 hidden"></p>
        </div>

        <!-- Result -->
        <div id="result" class="hidden mt-6 p-4 bg-gray-50 rounded border break-words text-sm">
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/v1/auth";
        let currentPhone = "";

        async function sendOtp() {
            const phoneInput = document.getElementById("phone").value.trim();
            if(!phoneInput) return alert("Please enter phone number");
            
            const btn = document.getElementById("send-btn");
            const msg = document.getElementById("send-msg");
            
            btn.innerText = "Sending...";
            btn.disabled = true;
            msg.classList.add("hidden");

            try {
                const response = await fetch(`${API_URL}/send-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: phoneInput })
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentPhone = phoneInput;
                    msg.innerText = "OTP sent successfully!";
                    msg.className = "text-sm mt-2 text-green-600 block";
                    document.getElementById("step-2").classList.remove("hidden");
                    document.getElementById("phone").disabled = true;
                } else {
                    msg.innerText = data.message || "Failed to send OTP";
                    msg.className = "text-sm mt-2 text-red-600 block";
                }
            } catch (err) {
                msg.innerText = "Network error. Is backend running?";
                msg.className = "text-sm mt-2 text-red-600 block";
            } finally {
                btn.innerText = "Send OTP";
                btn.disabled = false;
            }
        }

        async function verifyOtp() {
            const otpInput = document.getElementById("otp").value.trim();
            if(!otpInput) return alert("Please enter OTP");

            const btn = document.getElementById("verify-btn");
            const msg = document.getElementById("verify-msg");
            const resultDiv = document.getElementById("result");
            
            btn.innerText = "Verifying...";
            btn.disabled = true;
            msg.classList.add("hidden");
            resultDiv.classList.add("hidden");

            try {
                const response = await fetch(`${API_URL}/verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: currentPhone, otp: otpInput })
                });

                const data = await response.json();
                
                if (response.ok) {
                    msg.innerText = "OTP verified successfully!";
                    msg.className = "text-sm mt-2 text-green-600 block";
                    
                    resultDiv.classList.remove("hidden");
                    resultDiv.innerHTML = `<strong>Success! JWT Token:</strong><br><br>${data.data.token}`;
                } else {
                    msg.innerText = data.message || "Invalid OTP";
                    msg.className = "text-sm mt-2 text-red-600 block";
                }
            } catch (err) {
                msg.innerText = "Network error";
                msg.className = "text-sm mt-2 text-red-600 block";
            } finally {
                btn.innerText = "Verify OTP";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
